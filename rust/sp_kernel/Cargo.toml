[package]
name = "sp_kernel"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
wgpu = { version = "22", optional = true, default-features = true }
pollster = { version = "0.3", optional = true }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }

[features]
# Optional GPU probing/acceleration (wgpu). Not built by default — the
# solver is fully functional without it; enable with --features gpu.
gpu = ["dep:wgpu", "dep:pollster"]

[[bin]]
name = "gpu_probe"
required-features = ["gpu"]

[[bin]]
name = "gpu_bench"
required-features = ["gpu"]
